name: CI

# When this pipeline runs. A change that touches only Markdown (README, docs,
# CHANGELOG) cannot change a test result, so it does not start a run (#183).
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

# A new push to a PR supersedes the run still testing the old one: cancel it
# rather than finish a result nobody will read. Pushes to main each keep
# their run (each has its own sha, so its own group).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull your code into the clean runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Python 3.11 and the virtualenv, restored from cache when
      #    requirements*.txt is unchanged (#183). The cache key is the
      #    requirements' hash, so any pin change installs from scratch: the
      #    honest test that requirements.txt is complete (CLAUDE.md rule #21)
      #    still runs every time it could fail.
      #    LibreOffice too (cached), so the test that converts a real DOCX to
      #    PDF runs here instead of being skipped. It also proves, on every PR,
      #    that the cached LibreOffice the polls rely on still converts.
      - name: Set up runtime
        uses: ./.github/actions/setup-runtime
        with:
          libreoffice: "true"

      # 3. Run the suite. No secrets needed: tests mock Gemini, the DB,
      #    boto3 (moto), and FastAPI (TestClient). DATABASE_URL is a throwaway
      #    value — src/state/db.py builds the engine at import time, but the
      #    engine is lazy (never connects here) and the DB tests mock
      #    session_scope. The value only needs to exist so imports succeed.
      - name: Run tests
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
        run: pytest -v
