name: CI

# When this pipeline runs.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull your code into the clean runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Install the same Python you run locally (3.11). cache: pip reuses
      #    downloaded wheels across runs so torch isn't re-fetched every time.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. Install dependencies exactly as a fresh contributor would — this is
      #    the honest test that requirements.txt is complete (CLAUDE.md rule #21).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the suite. No secrets needed: tests mock Gemini, the DB,
      #    boto3 (moto), and FastAPI (TestClient).
      - name: Run tests
        run: pytest -v
