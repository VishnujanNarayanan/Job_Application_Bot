<!doctype html><html><head><title>Data Engineer | Acme | LinkedIn</title></head><body>
<!-- LinkedIn-shaped job page with an Easy Apply dialog: contact step, a resume step where an
     OLD resume is pre-selected, a questions step, review, submit, confirmation. Made-up data. -->
<main><h1>Data Engineer</h1><div>Acme · Pune, India</div>
<button class="jobs-apply-button" aria-label="Easy Apply to Data Engineer at Acme">Easy Apply</button></main>
<script>
const today = new Date().toLocaleDateString('en-US');
const steps = [
  `<h3>Contact info</h3>
   <div class="jobs-easy-apply-form-element"><label for="fn">First name</label><input id="fn" value="Test"></div>
   <div class="jobs-easy-apply-form-element"><label for="cc">Phone country code</label>
     <select id="cc"><option>Select an option</option><option selected>India (+91)</option><option>United States (+1)</option></select></div>
   <div class="jobs-easy-apply-form-element"><label for="ph">Mobile phone number</label><input id="ph"></div>`,
  `<h3>Resume</h3>
   <div class="cards">
     <div class="jobs-document-upload-redesign-card__container jobs-document-upload-redesign-card__container--selected" id="old">
       <input type="radio" name="doc" checked> Old_Resume.pdf Last used on 10/1/2026</div>
   </div>
   <label class="jobs-document-upload__upload-button">Upload resume
     <input type="file" id="up" accept=".pdf" style="position:absolute;width:1px;height:1px;opacity:0"></label>`,
  `<h3>Additional Questions</h3>
   <div class="jobs-easy-apply-form-element"><label for="yx">How many years of work experience do you have with Python?</label><input id="yx" required></div>
   <fieldset><legend>Will you now or in the future require sponsorship to work in India? *</legend>
     <label><input type="radio" name="sp" value="Yes" required>Yes</label><label><input type="radio" name="sp" value="No">No</label></fieldset>`,
  `<h3>Review your application</h3><p>Check your details.</p>`,
];
let at = 0;
function render(modal) {
  const body = modal.querySelector('.body');
  body.innerHTML = steps[at];
  const btn = modal.querySelector('.primary');
  btn.textContent = at === 0 || at === 1 || at === 2 ? 'Next' : 'Submit application';
  btn.setAttribute('aria-label', at < 3 ? (at === 2 ? 'Review your application' : 'Continue to next step') : 'Submit application');
  const up = body.querySelector('#up');
  if (up) up.addEventListener('change', () => {
    const cards = body.querySelector('.cards');
    cards.querySelectorAll('[class*=card__container]').forEach((c) => { c.classList.remove('jobs-document-upload-redesign-card__container--selected'); c.querySelector('input').checked = false; });
    const c = document.createElement('div');
    c.className = 'jobs-document-upload-redesign-card__container jobs-document-upload-redesign-card__container--selected';
    c.innerHTML = `<input type="radio" name="doc" checked> ${up.files[0].name} Uploaded on ${today}`;
    cards.prepend(c);
  });
}
document.querySelector('.jobs-apply-button').addEventListener('click', () => {
  const modal = document.createElement('div');
  modal.className = 'jobs-easy-apply-modal'; modal.setAttribute('role', 'dialog');
  modal.innerHTML = '<button aria-label="Dismiss" class="x">×</button><div class="body"></div><button class="primary"></button>';
  document.body.appendChild(modal);
  modal.querySelector('.x').addEventListener('click', () => {
    const d = document.createElement('div'); d.setAttribute('role', 'alertdialog');
    d.innerHTML = 'Discard application? <button data-control-name="discard_application_confirm_btn">Discard</button>';
    document.body.appendChild(d);
    d.querySelector('button').addEventListener('click', () => { modal.remove(); d.remove(); window.__discarded = true; });
  });
  modal.querySelector('.primary').addEventListener('click', () => {
    const body = modal.querySelector('.body');
    const missing = [...body.querySelectorAll('input[required]')].filter((i) => i.type === 'radio'
      ? !body.querySelector(`input[name=${i.name}]:checked`) : !i.value);
    if (missing.length) { body.insertAdjacentHTML('beforeend', '<div class="artdeco-inline-feedback--error">Please enter a valid answer</div>'); return; }
    if (at === 3) { window.__submitted = { phone: window.__phone, years: window.__years, sponsor: window.__sponsor,
                                           resume: document.querySelector('#chosen') ? 1 : 0 };
                    modal.querySelector('.body').innerHTML = '<h3>Your application was sent to Acme!</h3>';
                    modal.querySelector('.primary').textContent = 'Done'; modal.querySelector('.primary').setAttribute('aria-label', 'Done'); at = 4; return; }
    if (at === 0) window.__phone = body.querySelector('#ph').value;
    if (at === 1) { const sel = body.querySelector('[class*=card__container--selected]'); window.__resume = sel ? sel.innerText.trim() : ''; }
    if (at === 2) { window.__years = body.querySelector('#yx').value; const s = body.querySelector('input[name=sp]:checked'); window.__sponsor = s ? s.value : ''; }
    at += 1; render(modal);
  });
  render(modal);
});
</script></body></html>
