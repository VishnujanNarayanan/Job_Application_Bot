<!doctype html><html><head><title>Data Engineer | Acme | LinkedIn</title></head><body>
<!-- LinkedIn-shaped (2026): obfuscated classes; the job's own button has aria-label "Easy Apply to
     this job" while similar-job cards are links that also say "Easy Apply"; the apply flow is a
     native <dialog>; contact info is pre-filled; the resume step lists old uploads with one
     PRE-SELECTED and an "Upload resume" button that opens the system file picker; the questions
     step comes with answers LinkedIn remembered (Python = 5); then review and submit. Made-up data. -->
<main><h1>Data Engineer</h1><div>Acme · Pune, India</div>
<button class="ekfj5d ekfj5c" type="button" aria-label="Easy Apply to this job"><span>Easy Apply</span></button>
<section><h2>Similar jobs</h2><a class="ekfhdb" href="/jobs/view/999/">Azure Data Engineer · Easy Apply</a></section></main>
<dialog class="ekfkec"><button aria-label="Dismiss" class="x">×</button><div class="body"></div>
  <footer><button class="back" type="button" style="display:none">Back</button><button class="primary" type="button"></button></footer></dialog>
<script>
const today = new Date(); const fmt = (d) => `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;
const dlg = document.querySelector('dialog');
const steps = [
  `<h3>Contact info</h3>
   <div><label for="em">Email address*</label><select id="em" required><option>test@example.com</option></select></div>
   <div><label for="cc">Phone country code*</label><select id="cc"><option>Select an option</option><option selected>India (+91)</option><option>United States (+1)</option></select></div>
   <div><label for="ph">Mobile phone number*</label><input id="ph" value="9000000000" required></div>`,
  `<h3>Resume*</h3><p>Select or upload a resume in DOC, DOCX, or PDF format that is less than 2MB</p>
   <div class="cards">
     <div class="card"><span>PDF</span> Test_Person_Resume.pdf 11/9/2026 <input type="radio" name="doc" checked></div>
     <div class="card"><span>PDF</span> Test_Person_Resume.pdf 10/24/2026 <input type="radio" name="doc"></div>
     <div class="card"><span>PDF</span> resume new 6.pdf 7/4/2025 <input type="radio" name="doc"></div>
   </div>
   <button type="button" class="upload">Upload resume</button>`,
  `<h3>Additional Questions</h3>
   <div><label for="az">How many years of work experience do you have with Microsoft Azure?*</label><input id="az" required></div>
   <div><label for="py">How many years of work experience do you have with Python (Programming Language)?*</label><input id="py" value="5" required aria-describedby="error-message-py"><p id="error-message-py" class="ekferr"></p></div>
   <div><label for="wy">How many years of work experience do you have? (Only Whole Numbers Allowed)*</label><input id="wy" required></div>
   <fieldset><legend>Will you now or in the future require sponsorship to work in India?*</legend>
     <label><input type="radio" name="sp" value="Yes" required>Yes</label><label><input type="radio" name="sp" value="No">No</label></fieldset>
   <!-- 2026: each radio is labelled with the QUESTION; "Yes"/"No" sit in a block beside it; no value, no required. -->
   <div componentkey="auth"><p>Are you legally authorized to work in India?*</p>
     <fieldset role="radiogroup" aria-describedby="error-message-auth">
       <div><div><div><input id="au1" type="radio" name="radio-group-auth" aria-label="Are you legally authorized to work in India?"><label for="au1"></label></div><div><p>Yes</p></div></div></div>
       <div><div><div><input id="au2" type="radio" name="radio-group-auth" aria-label="Are you legally authorized to work in India?"><label for="au2"></label></div><div><p>No</p></div></div></div>
     </fieldset><p id="error-message-auth" class="ekferr"></p></div>`,
  `<h3>Review your application</h3><p>Check your details.</p>`,
];
let at = 0;
function render() {
  const body = dlg.querySelector('.body');
  body.innerHTML = steps[at];
  dlg.querySelector('.primary').textContent = at < 2 ? 'Next' : at === 2 ? 'Review' : 'Submit application';
  const up = body.querySelector('.upload');
  if (up) up.addEventListener('click', () => {
    const input = document.createElement('input'); input.type = 'file'; input.accept = '.pdf,.doc,.docx';
    input.addEventListener('change', () => {
      const cards = body.querySelector('.cards');
      cards.querySelectorAll('input[type=radio]').forEach((r) => { r.checked = false; });
      const c = document.createElement('div'); c.className = 'card';
      c.innerHTML = `<span>PDF</span> ${input.files[0].name} ${fmt(today)} <input type="radio" name="doc" checked>`;
      cards.prepend(c);
      const toast = document.createElement('div'); toast.setAttribute('role', 'alert');
      toast.textContent = 'Resume uploaded successfully'; dlg.querySelector('.body').appendChild(toast);
    });
    input.click();
  });
}
const reminder = new URLSearchParams(location.search).get('reminder') === '1';
document.querySelector('button[aria-label="Easy Apply to this job"]').addEventListener('click', () => {
  at = 0;
  dlg.showModal();
  if (reminder) {
    // As on the real page: a separate box outside the apply <dialog>.
    dlg.close();
    const box = document.createElement('div'); box.className = 'ekfsafety';
    box.innerHTML = '<h2>Job search safety reminder</h2><p>Research the company.</p><button type="button">Review job post</button> <button type="button" class="cont">Continue applying</button>';
    document.body.appendChild(box);
    box.querySelector('.cont').addEventListener('click', () => { box.remove(); dlg.showModal(); render(); });
    return;
  }
  render();
});
dlg.querySelector('.x').addEventListener('click', () => {
  const d = document.createElement('div'); d.setAttribute('role', 'alertdialog');
  d.innerHTML = 'Discard application? <button type="button">Discard</button>';
  dlg.appendChild(d);
  d.querySelector('button').addEventListener('click', () => { dlg.close(); d.remove(); window.__discarded = true; });
});
dlg.querySelector('.primary').addEventListener('click', () => {
  const body = dlg.querySelector('.body');
  const missing = [...body.querySelectorAll('input[required]')].filter((i) => i.type === 'radio'
    ? !body.querySelector(`input[name=${i.name}]:checked`) : !i.value);
  if (missing.length) { body.insertAdjacentHTML('beforeend', '<div class="artdeco-inline-feedback--error">Please enter a valid answer</div>'); return; }
  // 2026-style errors: plain text in the element aria-describedby names; Next does nothing.
  if (at === 2) {
    const py = body.querySelector('#py');
    if (!/^\d+$/.test(py.value)) { body.querySelector('#error-message-py').textContent = 'Invalid input'; return; }
    if (!body.querySelector('input[name=radio-group-auth]:checked')) { body.querySelector('#error-message-auth').textContent = 'This field is required'; return; }
  }
  if (at === 0) window.__phone = body.querySelector('#ph').value;
  if (at === 1) { const r = body.querySelector('input[name=doc]:checked'); window.__resume = r ? r.parentElement.innerText.trim() : ''; }
  if (at === 2) { window.__azure = body.querySelector('#az').value; window.__python = body.querySelector('#py').value; window.__whole = body.querySelector('#wy').value;
                  const au = body.querySelector('input[name=radio-group-auth]:checked'); window.__auth = au ? au.parentElement.parentElement.innerText.trim() : '';
                  const s = body.querySelector('input[name=sp]:checked'); window.__sponsor = s ? s.value : ''; }
  if (at === 3) { window.__submitted = true; body.innerHTML = '<h3>Your application was sent to Acme!</h3>';
                  dlg.querySelector('.primary').textContent = 'Done'; at = 4; return; }
  if (at === 4) { dlg.close(); return; }
  at += 1; render();
});
</script></body></html>
