<!doctype html><html><head><title>Apply</title></head><body>
<!-- A question no answer covers: the operator answers it, submits, and the next visit fills it. -->
<form id="f" onsubmit="event.preventDefault(); document.body.dataset.submitted = '1';">
<label for="n">Full name *</label><input id="n">
<label for="e">Email *</label><input id="e" type="email">
<fieldset><legend>Do you hold a valid passport? *</legend>
  <label><input type="radio" name="pp" value="y">Yes</label><label><input type="radio" name="pp" value="n">No</label></fieldset>
<label for="why">Why do you want to join us?</label><textarea id="why"></textarea>
<button type="submit">Submit application</button>
</form></body></html>
