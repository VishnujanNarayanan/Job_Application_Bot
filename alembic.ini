# Alembic configuration. The database URL is NOT set here: it comes from
# DATABASE_URL in .env (see src/state/migrations/env.py), so this file holds
# no secrets and is committed.
#
#   alembic upgrade head      # create or update the schema
#   alembic current           # show the applied revision

[alembic]
script_location = src/state/migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
