# master_profile.example.yaml
#
# Your resume content, as structured data. Copy this file and fill it in:
#
#     cp master_profile.example.yaml master_profile.yaml
#
# master_profile.yaml is gitignored, so your details never reach the repo.
# Replace every value marked REPLACE_ME. Fields marked (optional) can be
# deleted.
#
# How the bot uses it:
#   - Bullets are used word for word. The LLM never writes or rewrites them;
#     for each job the bot picks the entries and bullets that fit best.
#   - Each job or project has one or more ROLE BLOCKS: the same experience
#     written for a different kind of job (e.g. "backend" vs "data"). The bot
#     picks the block that suits each job ad.
#   - When you change this file, the next run notices, re-checks it and
#     re-embeds the bullets. You can also run: python -m src.cli.reparse
#   - Mistakes are reported with the field name, e.g. "actual_title must be
#     in safe_title_aliases".

# ---------------------------------------------------------------------------
# Personal: the resume header (see tools/personalize_template.py)
# ---------------------------------------------------------------------------
personal:
  name: "REPLACE_ME"                  # Full name, as on the resume
  email: "REPLACE_ME"                 # you@example.com
  phone: "REPLACE_ME"                 # (optional) +91 98765 43210
  location: "REPLACE_ME"              # (optional) City, State, Country
  linkedin: "REPLACE_ME"              # (optional) full URL
  github: "REPLACE_ME"                # (optional) full URL
  portfolio: "REPLACE_ME"             # (optional) full URL; shown instead of GitHub
  certificates_link: "REPLACE_ME"     # (optional) URL to your certificates

# ---------------------------------------------------------------------------
# Work experience. Every entry here appears on every resume.
# ---------------------------------------------------------------------------
work_experience:
  - id: "acme_2024"                   # Any unique id, no spaces
    company: "REPLACE_ME"             # Acme Corp
    actual_title: "Software Engineer" # Your real title. Must be in safe_title_aliases.
    # Every title this job may be shown under. Only list titles that are
    # honest descriptions of the work; the resume never uses anything else.
    safe_title_aliases:
      - "Software Engineer"           # your actual_title
      - "Backend Engineer"
    start_date: "2024-01"             # YYYY-MM
    end_date: "present"               # YYYY-MM, or "present"
    location: "REPLACE_ME"            # (optional) City, State
    # employment = a real job (always shown). freelance = a separate engagement
    # that competes for space like a project does.
    employment_type: "employment"     # (optional) employment | freelance
    link: ""                          # (optional) shown for freelance entries only

    role_blocks:
      - role: "backend"               # Short label for the kind of job this block targets
        role_fit: "primary"           # (optional) primary | adjacent
        # The entry line as it appears on the resume.
        entry_header: "Backend Engineer at Acme Corp, Bengaluru"
        entry_dates: "January 2024 to current"   # Required for work entries
        title_aliases:                # Subset of safe_title_aliases above
          - "Backend Engineer"
        # Shown in this order. The FIRST bullet is the plain-language summary
        # of the role. Aim for 3-8.
        bullets:
          - id: "acme_backend_b0"     # Unique across the whole file
            text: "REPLACE_ME: one-line summary of what you did, in plain words."
          - id: "acme_backend_b1"
            text: "REPLACE_ME: skill + how you used it + the result."
          - id: "acme_backend_b2"
            text: "REPLACE_ME: skill + how you used it + the result."
        # (optional) True bullets that are only used when a job ad asks for
        # their keyword, e.g. Docker, Git, SQL.
        extra_bullets:
          - id: "acme_backend_x1"
            text: "REPLACE_ME: a bullet naming a specific tool you used."

      # (optional) The same job written for a different kind of role.
      # - role: "data"
      #   entry_header: "Data Engineer at Acme Corp, Bengaluru"
      #   entry_dates: "January 2024 to current"
      #   title_aliases: ["Data Engineer"]   # also add it to safe_title_aliases
      #   bullets:
      #     - id: "acme_data_b0"
      #       text: "..."

# ---------------------------------------------------------------------------
# Projects. These compete for space: the bot shows the ones that fit the job.
# ---------------------------------------------------------------------------
projects:
  - id: "job_bot"                     # Any unique id, no spaces
    name: "REPLACE_ME"                # Project name
    link: "REPLACE_ME"                # (optional) demo or repository URL
    tags: ["python", "postgres"]      # (optional) your own labels

    role_blocks:
      - role: "backend"
        # Projects have no dates: leave entry_dates out.
        entry_header: "REPLACE_ME: project name and one-line description"
        title_aliases: ["Backend Engineer"]
        bullets:
          - id: "job_bot_backend_b0"
            text: "REPLACE_ME: what the project does, in plain words."
          - id: "job_bot_backend_b1"
            text: "REPLACE_ME: skill + how you used it + the result."

# ---------------------------------------------------------------------------
# Skills. Used for matching only; nothing here is printed on the resume.
# Every skill that matters should also appear inside a bullet.
# ---------------------------------------------------------------------------
skills_pool:                          # (optional)
  - "Python"
  - "PostgreSQL"
  - "Docker"

# (optional) Your own list of skills you're learning. Kept as a record only;
# the "Gap skills" in Telegram messages are worked out per job.
gap_skills:
  - skill: "Kubernetes"

# ---------------------------------------------------------------------------
# Education and certifications. Kept as your record; the resume header shows
# them through the template (tools/personalize_template.py fills them in).
# ---------------------------------------------------------------------------
education:                            # (optional)
  - degree: "REPLACE_ME"              # B.Tech Computer Science
    institution: "REPLACE_ME"         # University name
    dates: "2020 - 2024"
    score: "REPLACE_ME"               # (optional) 8.1 CGPA

certifications:                       # (optional)
  - id: "cert_1"
    name: "REPLACE_ME"                # Certificate name
    verify_link: "REPLACE_ME"         # URL where it can be verified
