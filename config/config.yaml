# config/config.yaml
# Single source of truth for all runtime tunables. No magic numbers in src/.
# Secrets (API keys, DATABASE_URL) live in .env only.
# The user owns master_profile.yaml (gitignored); this file is checked in.

# ---------------------------------------------------------------------------
# Operator identity (NFR-11). Another person swaps this block, .env,
# master_profile.yaml and resumes/templates/ to run their own instance with no
# code edits. Resume/cover filenames are derived from full_name.
# ---------------------------------------------------------------------------
operator:
  full_name: "Vishnujan Narayanan"
  years_experience: 1.5
  timezone: "Asia/Kolkata"

  # Resume header lines for tools/build_headless_template.py. Hand-trimmed to
  # fit the method's three-line Education & Certificates cap (~89 chars a
  # line). Left unset, they are derived from master_profile.yaml.
  resume_header:
    portfolio_url: "https://vishnujan.dev"
    education_line: "B.Tech CSE (Big Data), UPES Dehradun"
    education_status: "Status - Graduated (2025)"
    certificates_line: "IBM Generative AI Engineering, Google Advanced Data Analytics, Google Data Analytics, NPTEL (IIT Madras / IIT Kharagpur)"

# ---------------------------------------------------------------------------
# Hard filters — Layers 2/3
# ---------------------------------------------------------------------------
filters:
  job_type: "fulltime"
  # Reject a JD only when it explicitly asks for more years than this. A JD
  # that states none parses to 0 and passes. Also checked before the parse
  # against Naukri's experience band ("3-6 Yrs"), using its lower bound.
  years_ceiling: 6
  # Open to relocation; no visa filter.
  visa_filter: null
  # Reject jobs whose location contains any of these (case-insensitive).
  disallowed_regions:
    - "Delhi"
    - "Gurgaon"
    - "Gurugram"
    - "Noida"
    - "Ghaziabad"
    - "Faridabad"
  company_blocklist: []   # whole company names, case-insensitive; checked before the parse

  # Title regexes (case-insensitive) for employment types the operator
  # rejects, checked before the parse — the parser has called internships
  # full-time. Not listed on purpose: "trainee" (Graduate Engineer Trainee is
  # a full-time role in India) and "smart contract".
  title_blocklist:
    - '\bintern(s|ship|ships)?\b'
    - '\bapprentice(s|ship|ships)?\b'
    - '\bpart[- ]?time\b'
    - '\bfreelanc(e|er|ers|ing)\b'
    - '(?<!smart )\bcontract(ual|or|ors)?\b'

  # Skip, before the parse, a job whose applicant count means even this fit
  # could not clear scoring.apply_threshold. The best fit seen so far is
  # 0.787 (2026-10-09). Raise it to skip fewer.
  best_realistic_fit: 0.80

  # LinkedIn seniority labels to skip before the parse (case-insensitive).
  # "mid-senior level" is not listed: LinkedIn files plain "Java Developer"
  # and "Software Engineer II" roles under it.
  job_level_blocklist:
    - "director"
    - "executive"

# ---------------------------------------------------------------------------
# Salary — informational only, never filled in on a form (FR-12). Expected =
# the JD's upper bound if stated, else this default.
# ---------------------------------------------------------------------------
salary:
  default_expected_lpa: 6.0

# ---------------------------------------------------------------------------
# Scheduler — Layer 1. Cron runs outside Python; these values document the
# cron entries. No application quotas (hard rule #14).
# ---------------------------------------------------------------------------
scheduler:
  cadence:
    peak_interval_minutes: 40     # weekdays 8am–6pm IST
    off_peak_interval_hours: 4    # nights and weekends
    weekly_report_day: "sunday"
    weekly_report_hour_ist: 8

# ---------------------------------------------------------------------------
# Scraper — Layer 2 (JobSpy, public listings only; never logs into the
# operator's LinkedIn account, hard rule #4 / FR-15)
# ---------------------------------------------------------------------------
scraper:
  # JobSpy `hours_old`: how far back each run looks. Whole hours; 0 disables
  # the age filter entirely, so 1 is the minimum.
  hours_old:
    peak: 1
    off_peak: 1
  # Stop after this many jobs reach a verdict in one run. 0 = off;
  # time_budget_minutes is the guard instead.
  short_circuit_count: 0
  # Stop starting new jobs this far into a run, so it finishes cleanly
  # (verdicts written, summary sent) inside the workflow's 50-minute timeout.
  time_budget_minutes: 40
  # Jobs from the last N days with no verdict are processed first by the next
  # run. 0 = off: unreached jobs are dropped rather than piling up as stale
  # listings. 3 carries them over.
  backlog_days: 0
  results_wanted_per_term: 50
  # Geo-filter for Indeed and Glassdoor only.
  country: "india"
  # The only geo-filter LinkedIn honours; without it LinkedIn returns
  # worldwide listings.
  location: "India"
  # Fetch each LinkedIn and Naukri description individually. Without it
  # jd_text is empty, which starves the parser and makes every job a
  # near-duplicate of the first. Costs a request per job, bounded by
  # rate_limit below.
  fetch_description: true
  # One extra LinkedIn call per term with the Remote filter on, since the
  # plain search is almost all on-site (98 of 1,182 parsed jobs were remote).
  # Wider window because remote listings are sparse. results_wanted 0 = off.
  remote:
    results_wanted: 15
    hours_old: 24
  rate_limit:
    # One JobSpy call per site, so one site failing doesn't lose the others.
    per_site: true
    # Retry with exponential backoff + jitter.
    max_retries: 3
    backoff_base_seconds: 5
    # Randomised pause between site calls.
    inter_site_delay_seconds: 4
    # Lower than results_wanted_per_term, since each LinkedIn job costs an
    # extra description fetch.
    linkedin_results_wanted: 25
    # Optional rotating proxies (empty = direct connection).
    proxies: []
  sites:
    # Indeed and Glassdoor are off while apis.indeed.com times out from this
    # network. Re-add "indeed" and "glassdoor" once it doesn't.
    - "linkedin"
    - "naukri"
  # Search-term rotation. Each run takes `terms_per_run` terms from the stored
  # index (search_rotation_state table) and advances past them. New terms go
  # at the end so the stored index keeps pointing at the same term.
  # To pick a term by hand, run `python -m src.main` (arrow-key menu) or pass
  # `--term "..."`; a hand-picked term doesn't move the rotation. `--auto`
  # skips the menu.
  #
  # Each scraped job costs 1 LLM call to parse, so more terms per run sweeps
  # the list faster but costs more per run; 1 is the cheapest.
  terms_per_run: 1
  # Each role is searched as-is and with "junior" in front, since junior
  # postings are often titled that way and a plain search ranks them below
  # senior ones. The two are interleaved.
  search_terms:
    - "backend engineer"
    - "junior backend engineer"
    - "backend developer"
    - "junior backend developer"
    - "software engineer python"
    - "junior software engineer python"
    - "platform engineer"
    - "junior platform engineer"
    - "API developer"
    - "junior API developer"
    - "data engineer"
    - "junior data engineer"
    - "analytics engineer"
    - "junior analytics engineer"
    - "data pipeline engineer"
    - "junior data pipeline engineer"
    - "data scientist"
    - "junior data scientist"
    - "data analyst"
    - "junior data analyst"
    - "machine learning engineer"
    - "junior machine learning engineer"
    - "ML engineer"
    - "junior ML engineer"
    - "AI engineer"
    - "junior AI engineer"
    - "fullstack engineer"
    - "junior fullstack engineer"
    - "full stack developer"
    - "junior full stack developer"
    - "software engineer"
    - "junior software engineer"
    - "devops engineer"
    - "junior devops engineer"
    - "SRE"
    - "junior SRE"
    - "quant developer"
    - "junior quant developer"
    - "trading systems developer"
    - "junior trading systems developer"
    - "financial software engineer"
    - "junior financial software engineer"
    - "market data engineer"
    - "junior market data engineer"
    - "quantitative researcher"
    - "junior quantitative researcher"
    - "quantitative analyst"
    - "junior quantitative analyst"
    # AI-assisted development and LLM roles. No junior variant where nobody
    # posts one: Claude Code specialist, AI prompt engineer, AI agent
    # developer, agentic AI engineer.
    - "Claude Code specialist"
    - "prompt engineer"
    - "junior prompt engineer"
    - "AI prompt engineer"
    - "LLM engineer"
    - "junior LLM engineer"
    - "generative AI engineer"
    - "junior generative AI engineer"
    - "GenAI developer"
    - "junior GenAI developer"
    - "AI agent developer"
    - "agentic AI engineer"
    - "AI automation engineer"
    - "junior AI automation engineer"
    # Infrastructure roles ("platform engineer" is already near the top).
    - "infrastructure engineer"
    - "junior infrastructure engineer"
    - "data infrastructure engineer"
    - "junior data infrastructure engineer"
  # Every scraped job is re-parsed and re-scored each run unless already
  # notified, so jobs left without a verdict by an aborted run aren't later
  # dismissed as duplicates. true re-examines notified jobs too, so the same
  # match can arrive on Telegram again.
  rescore_notified: false

# ---------------------------------------------------------------------------
# ATS poll — companies' own job boards, read directly (#97)
# `python -m src.ats_pipeline`. Boards come from ats_boards.poll
# (tools/ats_discover.py --upload). Separate from the JobSpy run.
# ---------------------------------------------------------------------------
ats_poll:
  atses: [greenhouse, lever, ashby, smartrecruiters]
  # One request per ATS this far apart; ATSes run in parallel. 0.5 s = two
  # a second (#111: no 429 in 50,000+ requests at 1 s). A 429 slows that
  # ATS back to 1 s for the rest of the run.
  delay_seconds: 0.5
  # Each ATS stops starting boards after this long; boards not reached stay
  # due and go first next run. Hot boards are polled first, so they are
  # always reached (#110).
  time_budget_minutes: 10
  # Re-poll interval by board tier: hot = sent a job in the last 7 days,
  # active = posted anything in 7 days, quiet = nothing.
  tier_hours: {hot: 1, active: 3, quiet: 12}
  # Recorded in ats_postings but not processed (remote tied to another
  # region). Remove to stop recording them.
  record_places: [remote_locked]
  # An unclear title goes to the parser only if its description names at
  # least this many of the operator's skills_pool terms. 2 let a Product
  # Manager and a Process Trainer through on domain words ("E-commerce",
  # "fintech") in the first live run (2026-10-16).
  min_pool_skills: 3
  # A board's first poll sends only postings this recent; the rest are
  # recorded as already open.
  baseline_hours: 24
  sr_max_pages: 30
  # An ATS posting matching a LinkedIn/Naukri job (same company, title)
  # from this many days is not processed again.
  dedupe_days: 30
  # Jobs a poll found but did not reach are retried for this long.
  backlog_days: 2
  # ATS jobs have no applicant count (x1.0), so they get their own bar (#120).
  # 0.47 under the weighted_count fit (#101): as many matches as 0.40 gave
  # under the share formula. Other sources keep scoring.apply_threshold.
  apply_threshold: 0.47
  # Minutes for parse/score/build after the poll.
  process_budget_minutes: 25
  closed_retention_days: 60
  # The ATS run logs the database size; a warning above this (Neon's free
  # tier is 512 MB, #115).
  db_size_warn_mb: 300
  recency_window_hours: 24

# ---------------------------------------------------------------------------
# Selection — Layer 4 (deterministic, no LLM)
# ---------------------------------------------------------------------------
selection:
  # --- The JD checklist ------------------------------------------------------
  # The template has no Skills section, so a qualification counts only when a
  # bullet states it.
  keywords:
    weight_required: 1.00
    # Half weight: the offline grader (score_coverage.py) ignores "Nice to
    # Have" lines entirely.
    weight_nice_to_have: 0.50
    # Responsibilities are duty prose no bullet can match; tokenising them
    # deflates coverage. They still feed the embedding tie-break.
    include_responsibilities: false
    # The 128-title sheet, used only as a tie-break
    # (src/scorer/qualifications.py). Unset or missing = tie-break off.
    qualifications_path: "data/job_qualifications.md"

  # --- Bullets per entry -----------------------------------------------------
  # Method: 3 to 8 (1 summary + 2-7), scaled to time in the role.
  bullets:
    min_per_entry: 3
    # One cap for jobs, freelance and projects alike.
    max_cap: 8
    # Projects stop sooner: with a flat 8 every project filled all 8 slots,
    # the last ones with restatement.
    project_cap: 5
    # Phase 1 beam width; 20 reaches the same optimum as 200 on a 50-bullet pool.
    beam_width: 20
    # Phase 2: fill remaining slots from the title's qualification checklist.
    # Stops at zero gain, never pads to the cap.
    qualification_fill: true
    # Extra bullets per entry (#137). An extra usually carries one keyword, so
    # several of them make an entry long and thin. At most `max_extras` render,
    # the best by coverage; a further extra renders only when it adds a keyword
    # term_type() calls a tool (Docker, PySpark) that the entry has not shown.
    # Methods, concepts and soft skills count toward the limit. 0 = no limit.
    max_extras: 2
    # After selection, a skipped main bullet replaces the extras whose keywords
    # it carries: no keyword lost, at most one keyword repeated within the
    # entry, the entry never longer, the pinned summary never touched (#137).
    main_exchange: true

    # --- Repetition ------------------------------------------------------------
    # Within one entry, a bullet that only restates covered keywords is never
    # selected. Across entries repetition is allowed (and rewarded by fit's
    # keyword_repetition term), except for the filler words below: at most
    # `max_keyword_renders` entries may claim one. A JD token containing a
    # listed term counts ("Agile methodologies"). 0 or an empty list = off.
    # AI coding tools are handled by jd_gated_terms instead.
    max_keyword_renders: 2
    capped_keywords:
      - "Agile"

    # --- Bullets the advert has to ask for -------------------------------------
    # A bullet naming any of these renders only when the advert's checklist
    # names one too, and at most once per page. These tools appear in most
    # repos, so without the gate they land on pages for jobs that never
    # mentioned AI tooling. Empty list = off.
    jd_gated_terms:
      - "Claude Code"
      - "OpenAI Codex"
      - "Codex"
      - "Cursor"
      - "GitHub Copilot"
      - "Copilot"
      - "Model Context Protocol"
      - "MCP"
    # Wordings that also open the gate (#21), matched literally against the
    # raw advert as well as the parsed fields. Mined from 1,053 adverts; each
    # kept only where it meant using AI to build software. Left out on
    # purpose: "prompt engineering" (usually building LLM apps), bare "AI
    # tools" and bare "AI". Tool names no bullet mentions go here rather than
    # in jd_gated_terms, which also marks bullets as gated.
    jd_gate_openers:
      # generic wordings
      - "AI-assisted"
      - "AI-augmented"
      - "AI coding"
      - "AI coding assistant"
      - "AI coding assistants"
      - "AI coding tools"
      - "AI assistant"
      - "AI assistants"
      - "AI copilot"
      - "AI copilots"
      - "AI tooling"
      - "AI pair programming"
      - "AI pair programmer"
      - "AI-powered developer tools"
      - "AI-powered engineering tools"
      - "AI-powered assistants"
      - "AI-driven development tools"
      - "AI-driven tools"
      - "AI development tools"
      - "AI development tooling"
      - "AI productivity tools"
      - "AI-first development"
      - "coding assistant"
      - "coding assistants"
      - "code assistant"
      - "GenAI tools"
      - "Gen AI tools"
      - "generative AI tools"
      - "LLM tools"
      - "LLM tooling"
      - "LLM assistants"
      - "agentic coding"
      - "agentic development"
      - "agentic engineering"
      - "agentic software development"
      - "vibe coding"
      # tools named in adverts that no bullet names
      - "ChatGPT"
      - "Windsurf"
      - "Kiro"
      - "Amazon Q Developer"
      - "Amazon Q"
      - "Tabnine"
      - "CodeWhisperer"
      - "Gemini Code Assist"

  # --- Common bullets (#30) --------------------------------------------------
  # master_profile.yaml `common_bullets`: claims true regardless of repo (soft
  # skills, ways of working). Each renders only when the advert names one of
  # its triggers, and only after every entry has chosen its own bullets
  # (src/scorer/common.py).
  common_bullets:
    enabled: true
    # Past three they read as padding.
    max_per_page: 3
    # Spreads them across entries; each family is also once per page.
    max_per_entry: 1

  # --- Entry scoring ---------------------------------------------------------
  entry:
    # Which entries make the page. `coverage` is what a recruiter grades;
    # `similarity` (mean cosine of the selected bullets) is "is this the same
    # kind of work" and stops a keyword-dense, off-topic entry ranking top.
    # Which entry leads is ordered separately by selector.entry_score, using
    # scoring.fit.lead_entry_weights (#31).
    weight_similarity: 0.50
    weight_coverage: 0.50
    # --- Which block leads -------------------------------------------------------
    # The lead block supplies the render set, header, dates and title. Chosen
    # on what its bullets cover of the JD, not its title aliases:
    #
    #   lead = lead_weight_keywords * keyword_score + lead_weight_similarity * cosine
    #
    # Cosine separates blocks that cover the same keywords.
    lead_weight_keywords: 0.75
    lead_weight_similarity: 0.25

    # Bullets are pooled across an entry's role_blocks. Off-role blocks'
    # coverage is scaled by their relevance to the JD, so an off-role bullet
    # wins only when nothing on-role covers that keyword.
    off_role_scaling: true
    off_role_floor: 0.05  # relevance never scales fully to zero
    # The salaried job (employment_type: employment) must appear within the
    # first N entries. Freelance doesn't count. 0 = off.
    job_within_top: 2
    # Entries whose bullets were hand-rewritten with business numbers. Only
    # these may sit in the first `featured_within_top` slots; every other entry
    # starts at slot N+1. Best match among them leads. Empty list = off.
    featured_within_top: 2
    featured_entries:
      - job_application_bot
      - market_data
      - dekhlaw
      - mql5
      - law_firm_website
      - product-explorer
      - accredian_intership
      - age_gender_classifier
      - directory-app

  # --- How many entries reach the page ---------------------------------------
  # Chosen as a set (#25): entries join in order of the JD keyword weight they
  # add; the page stops when nothing adds anything, is capped at max_entries,
  # and topped up by score to min_entries. top_n is the fallback cap when
  # max_entries is unset. The salaried job is always included.
  top_n: 5
  min_entries: 3
  max_entries: 6
  # A candidate joins only if its score is at least this share of the best
  # entry's. 0.0 = off: 0.5 and 0.7 only lowered coverage and apply count
  # over 1,220 stored jobs.
  entry_score_floor: 0.0

  # What a freelance entry shows in the right slot (a job shows dates, a
  # project its link).
  freelance:
    label: "Freelance"

scoring:
  final:
    # final = min(max_score, fit x success_prob)
    # success_prob is the applicant multiplier (#26): early postings are
    # boosted, crowded ones penalised.
    max_score: 1.0
  # How many distinct job ads a term must appear in to join the technology
  # vocabulary Layer 3 scans each JD for. Filters out one-off and
  # hallucinated terms. 3, not 5: on a hold-out of the 200 newest ads
  # (2026-10-16) it cut skills the dictionary misses from 28% to 24%.
  vocabulary_min_jobs: 3

  # Which parser decides a job, from its free dictionary-parse score
  # (src/parsing/router.py). Below `floor` the job is LOW_SCORE with no LLM
  # call (#100). 0 turns the floor off. `enabled` turns on the rest of #71:
  # dictionary decides below `skip_below` and at/above `trust_above`, the LLM
  # in between. Re-derived for the weighted_count fit (#101) on a replay of
  # 1,433 jobs (2026-10-17): the floor skips as many jobs as 0.40 did under
  # `share`; 0.51 / 0.88 save as many LLM calls as 0.44 / 0.75 did, losing 9
  # LLM matches instead of 17. Bump `version` when a cut-off moves.
  parse_routing:
    floor: 0.437
    enabled: true
    skip_below: 0.51
    trust_above: 0.88
    daily_llm_budget: null
    version: "2026-10-17"

  # Jobs below this are not applied to (LOW_SCORE). The one number to turn if
  # match volume is wrong: lower for more, raise for fewer. At 0.65 a
  # first-25 posting needs fit 0.43 and one at 100 applicants needs 0.65.
  # (0.60 until #101 switched the fit formula.)
  apply_threshold: 0.65

  fit:
    # Weights sum to 1.0.
    #   lead_entry         the entry leading the page: same kind of work
    #                      (calibrated similarity) and its own JD coverage
    #   keyword_coverage   weighted share of the JD's qualifications the
    #                      selected bullets contain (src/scorer/keywords.py)
    #   keyword_repetition per required JD keyword, min(entries showing it,
    #                      repetition_cap) / repetition_cap, averaged
    lead_entry: 0.45
    keyword_coverage: 0.35
    keyword_repetition: 0.20
    repetition_cap: 3
    # share: every part of fit is covered / total (until #101).
    # weighted_count (#101): each skill weighs kind x type x emphasis, and each
    # part is half the weighted share, half how many skills you have (up to
    # count_cap), so 12 of 15 beats 3 of 3. The thresholds are set for
    # weighted_count (2026-10-17); re-derive them before switching back.
    formula: weighted_count
    weighted_count:
      # Kind is selection.keywords: required 1.0, nice-to-have 0.5 (2:1).
      # Type ratios; only ratios matter (divided by concept in code).
      type: {generic: 1.0, concept: 2.4, tool: 3.0}
      # +25% per signal: in the title, on a must-have/strong line, named 3+ times.
      emphasis: 0.25
      # Half quality (weighted share), half quantity (skills matched).
      count_weight: 0.5
      # 25 matched skills = full marks for quantity; 8% of 1,433 past jobs reach it.
      count_cap: 25
      # Short adverts: below `below` skills a tool's weight and match count up to
      # (1 + tool_boost), a generic skill's down to (1 - generic_cut), fading
      # to 1 at `below` as (1 - skills/below) ** power. 0 / 0 = off.
      # A concept's moves up by (1 + concept_boost) the same way.
      short_ad: {below: 12, power: 1.0, tool_boost: 3.0, concept_boost: 2.333, generic_cut: 0.6}
      # How a skill is typed is read off its name (keywords.term_type); these
      # lists override that. Lower or upper case, exact term.
      terms:
        # Named tools the rules miss.
        tool: [Spring, Confluence, Make, Excel, Jira, Teams Foundation Server, dbt]
        # Fields and practices written like names (acronyms, title case).
        concept: [AI, ML, AI/ML, NLP, GenAI, Gen AI, Generative AI, Agentic AI, AI agents, AI tools,
                  agentic, LLM, LLMs, RAG, ETL, ELT, ETL/ELT, ETL/ELT pipelines, DevOps,
                  DevOps practices, MLOps, Agile, Scrum, SaaS, GDPR, CI/CD, CI/CD pipelines,
                  microservices, NoSQL, fintech, Version Control, Dashboards, Workflows,
                  Healthcare, Mathematics, Collaborative Filtering, communication protocols,
                  Cloud, Testing, monitoring, Optimization, APIs, API, databases, automation,
                  deployment, documentation, design, backend, frontend, infrastructure,
                  architecture, modeling, evaluation, research, production, cloud, web,
                  web applications, BI, Sales]
        # Soft skills the rules miss.
        generic: [Teams, English, Hindi, Client, e.g, etc]
        # A phrase starting with one of these is a product: "Azure Data Factory".
        brand: [Azure, AWS, Amazon, Google, Apache, Microsoft, Oracle, SAP, Databricks,
                Snowflake, GCP, IBM, Salesforce, Adobe, Atlassian, Meta, OpenAI]
    # lead_entry = similarity x scaled + coverage x lead coverage.
    lead_entry_weights:
      similarity: 0.50
      coverage: 0.50
    # Raw bullet-vs-JD cosine sits in 0.22-0.40 for 90% of jobs, so it is
    # rescaled: `low` -> 0, `high` -> 1 (clamped). Re-measure as the corpus
    # grows.
    similarity_scale:
      low: 0.22
      high: 0.40

  # success_prob = the applicant multiplier: fewer applicants scores higher.
  # Read from LinkedIn's job page (all_jobs.applicants_count). Linear between
  # `boost_full_at` -> `max`, `neutral_at` -> 1.0 and `penalty_full_at` ->
  # `min`. "Be among the first 25" is stored as 24, "Over 200" as 201.
  # final x multiplier for a junior role (apply_decision.is_junior_role): no
  # senior_title word in the title, and 1..max_years years asked, the parser's
  # "junior" level, or a junior_title word. 1.0 = off.
  junior_boost:
    multiplier: 1.10
    max_years: 3
    junior_title: [junior, 'jr\.?', associate, entry, graduate, fresher, trainee, 'I', '1', L1]
    senior_title: [senior, 'sr\.?', lead, principal, staff, manager, head, architect, director, III, IV, L3, L4]

  success_prob:
    max: 1.50
    min: 0.50
    boost_full_at: 24
    neutral_at: 100
    penalty_full_at: 200
    # No count available: neutral.
    unknown: 1.00

  # Recorded, not scored: stored in applied/not_applied.recency_score for
  # analysis only.
  recency_score:
    # Bands by hours since posting, first match wins, ascending.
    bands:
      - under_hours: 6
        score: 1.00
      - under_hours: 24
        score: 0.60
      - under_hours: 72
        score: 0.40
    # Older than every band. An undated listing is dated from scraped_at plus
    # half the scrape window.
    default: 0.30
    # Neither posted_at nor scraped_at. Remove to use the bands' midpoint.
    unknown: 0.65

# ---------------------------------------------------------------------------
# Resume builder — Layer 5
# ---------------------------------------------------------------------------
builder:
  template_path: "resumes/templates/headless_v1.docx"
  output_dir: "resumes/applied"
  # Reject any build that changes content outside permitted regions. The
  # header (before the first WORK EXPERIENCE Heading1) is never touched.
  diff_check_enabled: true
  # Regenerate up to this many times when Pydantic or post-validation fails.
  llm_regenerate_attempts: 2
  cover_letter_max_chars: 900

# ---------------------------------------------------------------------------
# Voice guard — banned phrases in the generated cover letter (Layer 5)
# ---------------------------------------------------------------------------
voice:
  banned_words:
    - "leverage"
    - "synergy"
    - "robust"
    - "scalable"
    - "holistic"
    - "passionate about"
    - "I bring a unique blend"
    - "I am excited to"
    - "I am writing to"
    - "with X years of experience in"
    - "as a [role]"

# ---------------------------------------------------------------------------
# Cover letter PDF — Layer 6 pdf_render.py. Line 1 = name + email, line 2 =
# date, body below.
# ---------------------------------------------------------------------------
cover_pdf:
  font_family: "Arial"
  font_size_pt: 11
  font_color: "#000000"
  margin_cm: 2.0
  single_page: true
  header_enabled: false
  footer_enabled: false

# ---------------------------------------------------------------------------
# Embeddings & NLP
# ---------------------------------------------------------------------------
embeddings:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  dim: 384   # vector(384) in pgvector schema

spacy:
  model: "en_core_web_sm"

# ---------------------------------------------------------------------------
# LLM — one JD parse per job
# ---------------------------------------------------------------------------
llm:
  # Any OpenAI-compatible endpoint. Switching provider is an edit here plus a
  # key in .env.
  #
  #   groq       https://api.groq.com/openai/v1                 GROQ_API_KEY
  #   cerebras   https://api.cerebras.ai/v1                     CEREBRAS_API_KEY
  #   openrouter https://openrouter.ai/api/v1                   OPENROUTER_API_KEY
  #   gemini     https://generativelanguage.googleapis.com/v1beta/openai/
  #                                                             GEMINI_API_KEY
  #
  # Check a model is actually callable before setting it — being listed is not
  # enough (Gemini listed a retired model that 404'd every request):
  #     python -m src.cli.llm_check --list
  #
  # Groq free tier: 200,000 tokens/day plus a per-minute cap, which is what a
  # run hits; hence `rotation` below. gpt-oss-20b also works in TOOLS mode if
  # 120b is retired; qwen3.6-27b needs JSON_SCHEMA.
  provider: "groq"
  base_url: "https://api.groq.com/openai/v1"
  api_key_env: "GROQ_API_KEY"
  model: "openai/gpt-oss-120b"
  # Instructor mode: TOOLS needs function calling, JSON_SCHEMA native schema
  # enforcement, JSON works anywhere. Verify with llm_check after changing.
  instructor_mode: "TOOLS"
  request_timeout_seconds: 60
  # Wall-clock cap on one call (a provider block may override). The timeout
  # above only bounds gaps between bytes, and OpenRouter pads queued requests
  # with blank bytes. Past this the job moves to the next provider. 0 = no cap.
  call_deadline_seconds: 90
  max_calls_per_job: 1

  # How much of a JD reaches the model, for any provider without its own
  # `jd_text`. Head (role, requirements) and tail (pay, application details)
  # are both kept. Measured over 667 listings (median 4,172 chars):
  #   head+tail    chars   pay   years   level   jobs clipped
  #   1600+900      53%    70%     53%     86%       78%
  #   2000+1000     61%    73%     67%     90%       70%
  #   3000+1500     81%    87%     88%     97%       45%   <- configured
  #   5000+2000     96%    99%     97%    100%       12%
  # Clipping harder degrades years_required and role_level; this exists to
  # cap outliers that spike the per-minute token limit.
  jd_text_default:
    head_chars: 3000
    tail_chars: 1500

  # Which provider leads a parse. Every `every` parses the lead passes to the
  # next name; the others follow in order, then the rest of the chain. Only
  # enabled providers take a turn. Empty list = off. OpenRouter is left out
  # (slow, sometimes empty replies) and is only the last-resort backup. The
  # paid `gemini` key leads a third of jobs, so runs are not strictly $0.
  rotation:
    providers: ["groq", "gemini-free", "gemini"]
    every: 2

  # Providers tried when the one before gives up. Only permanent errors and
  # budget exhaustion advance the chain; ordinary rate limits are handled by
  # each provider's backoff. Order matters only for providers outside
  # `rotation`, which are tried after every rotation member fails. Disabled
  # entries are skipped.
  fallbacks:
    # OpenRouter free models: ~20 requests/minute, 50/day (1,000/day once $10
    # of credit has been bought). `openrouter/free` lets OpenRouter pick a free
    # model per call, so a withdrawn free model can't break the chain or move
    # it onto a paid one. Check: python -m src.cli.llm_check openrouter
    - enabled: true
      provider: "openrouter"
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: "OPENROUTER_API_KEY"
      model: "openrouter/free"
      instructor_mode: "JSON"
      request_timeout_seconds: 60

    # Gemini on a free key (its Google project has no billing). Named
    # "gemini-free" so the rotation doesn't confuse it with the paid `gemini`
    # entry. 3.5-flash-lite because 2.5-flash-lite is unavailable to new
    # projects. Check: python -m src.cli.llm_check gemini-free
    - enabled: true
      provider: "gemini-free"
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key_env: "GEMINI_FREE_API_KEY"
      model: "gemini-3.5-flash-lite"
      instructor_mode: "JSON"
      request_timeout_seconds: 60

    # Mistral — off: the console offered no free API plan (2026-10-06).
    # Check before enabling: python -m src.cli.llm_check mistral
    - enabled: false
      provider: "mistral"
      base_url: "https://api.mistral.ai/v1"
      api_key_env: "MISTRAL_API_KEY"
      model: "mistral-small-latest"
      instructor_mode: "JSON"
      request_timeout_seconds: 60

    # Cerebras — off: real calls return 402 payment_required even though the
    # key works for listing models (hard rule #12, free tier only).
    # Check: python -m src.cli.llm_check cerebras
    - enabled: false
      provider: "cerebras"
      base_url: "https://api.cerebras.ai/v1"
      api_key_env: "CEREBRAS_API_KEY"
      model: "gpt-oss-120b"
      instructor_mode: "TOOLS"
      request_timeout_seconds: 60

    # Paid key. flash-lite is cheap and non-thinking; thinking models bill
    # reasoning tokens as output (~20x the cost per parse).
    - enabled: true
      provider: "gemini"
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key_env: "GEMINI_API_KEY"
      model: "gemini-2.5-flash-lite"
      instructor_mode: "JSON"
      request_timeout_seconds: 60

  # Permanent errors (retired model, bad key, malformed request) skip retries
  # entirely — see _is_permanent() in src/llm/client.py.
  backoff:
    initial_seconds: 2
    max_seconds: 30
    max_attempts: 5

# ---------------------------------------------------------------------------
# State / database — Layer 7 (Neon PostgreSQL, free tier)
# ---------------------------------------------------------------------------
database:
  pool_size: 2
  max_overflow: 5
  pool_pre_ping: true   # recover from network blips
  # A dead socket (laptop slept mid-run) must fail, not hang — see db._connect_args.
  connect_timeout_seconds: 10
  keepalives_idle_seconds: 30      # idle socket: dead after ~30 + 3×10 = 60s
  keepalives_interval_seconds: 10
  keepalives_count: 3
  tcp_user_timeout_ms: 60000       # socket with an unacked query: dead after 60s
  outage_buffer_path: "data/pending_writes.jsonl"   # drained next run
  outage_backoff_attempts: 3

storage:
  resumes_applied_dir: "resumes/applied"    # never auto-cleaned (audit trail)
  # Download filename for a resume (#42). {name} is personal.name from the
  # profile, spaces -> underscores.
  resume_download_name: "{name}_Resume"
  logs_dir: "data/logs"
  cleanup:
    logs_retention_days: 365
    resumes_applied_retention_days: null   # null = keep forever

# ---------------------------------------------------------------------------
# Notifications — Layer 8 (Telegram)
# ---------------------------------------------------------------------------
notifications:
  digest_hour_ist: 8
  # Progress messages during a run (started, found per term, pre-parse
  # skips). Match messages and the summary are sent either way.
  progress: true
  # How often the endpoint polls Telegram for "Mark applied" / "Dismiss" taps
  # (#15). Runs also poll at start and end. 0 = endpoint polling off.
  tap_poll_seconds: 5
  # Sent immediately when any of these trigger.
  critical_alert_triggers:
    - "gemini_api_failure"
    - "database_connection_failure"
    - "master_profile_validation_failure"
    - "portal_zero_results_consecutive"
  # Consecutive zero-result runs from a portal before alerting.
  portal_zero_results_threshold: 3

# ---------------------------------------------------------------------------
# Analytics — Layer 9 (local files). The CSVs are regenerated from Postgres
# by `export_index`, never appended during a run, since GitHub Actions runs
# lose their disk. Paths are relative to the repo root.
# ---------------------------------------------------------------------------
analytics:
  local:
    dir: "data/index"
    matches_file: "matches.csv"
    skipped_file: "skipped.csv"
    near_duplicates_file: "near_duplicates.csv"
  report:
    monthly_enabled: true
    dir: "data/reports"
    # Skills in at least this share of the month's JDs get a "consider
    # learning" alert.
    skill_demand_alert_threshold: 0.30

# ---------------------------------------------------------------------------
# AWS — S3 cache + backup, region ap-south-1. Credentials live in .env only.
# ---------------------------------------------------------------------------
aws:
  region: "ap-south-1"
  s3_bucket: "application-bot-vishnujan-resumes"

# ---------------------------------------------------------------------------
# Pre-render resumes at build time (an operator override of hard rule #8), so
# links work while the laptop is off. Renders go to the `{ext}_cache/` S3
# prefix (1-month lifecycle rule) and render_cache; the endpoint still renders
# anything expired or never pre-rendered.
# ---------------------------------------------------------------------------
prerender:
  # How a match's resume reaches you (#99):
  #   telegram  the PDF is attached to the Telegram message, and a "Resume
  #             DOCX" button sends the DOCX. No AWS involved; the files stay
  #             in the chat.
  #   s3        "Resume PDF" / "Resume DOCX" buttons open presigned S3 links
  #             (the settings below), which expire after link_expiry_days.
  delivery: telegram
  # s3 delivery only: render at build time so the links work with the laptop off.
  enabled: true
  # Presigned-URL lifetime; AWS caps it at 7 days.
  link_expiry_days: 7

# ---------------------------------------------------------------------------
# Tailor a resume for a pasted advert (`python -m src.cli.tailor`, #20). No
# filter or threshold applies. Output goes here unless --out is given.
# ---------------------------------------------------------------------------
tailor:
  output_dir: "data/tailored"

# ---------------------------------------------------------------------------
# Resume endpoint + dashboard — FastAPI (Layer 6)
#
# base_url is the machine's Tailscale name, reachable only from the
# operator's tailnet — the security boundary, since the endpoint has no auth.
# Pre-rendered resumes are served from S3, so those links work anywhere.
#
# Setup:   tailscale serve --bg 8000
# Name:    tailscale status --json | grep DNSName
# ---------------------------------------------------------------------------
# Resume header location (#134). When on, a job in another Indian city gets
# "Relocating to <city> by <today + months>, willing to relocate sooner if required."
# The city comes from the job's location field (a known city, or any place in a
# segment marked India); when the field names no place (remote, a country, a
# state, blank), from the advert's "Location:" line or any known city in it. The
# profile location stays when no city is found, the job lists the operator's own
# city, or the field names only places abroad. Telegram, the dashboard, the CSV
# export and the tailor report show the line the resume prints.
relocation:
  enabled: true
  months: 1     # calendar months; 31 Jan + 1 is the last day of February

endpoint:
  # Must be a real host: Telegram rejects a localhost URL and drops the whole
  # notification.
  base_url: "https://asus-tuf-f16-vishnu.tail106cde.ts.net"
  port: 8000
  template_path: "resumes/templates/headless_v1.docx"
  # Days a cached render stays valid. Keep in step with the S3 lifecycle rule
  # on `pdf_cache/` and `docx_cache/`, or cache "hits" silently re-render.
  render_cache_ttl_days: 90

  # Headless template structure. The *_num_id values are numbering.xml ids;
  # the assembler detects structure, never text.
  render:
    # One section for work, freelance and projects, ordered by match.
    section_heading: "Work & Projects"
    # Right-slot link label, chosen by whether the URL is a code host. The
    # gaps are U+00A0 so Word doesn't wrap the arrow onto its own line.
    link_text_demo: "View Demo →"
    link_text_code: "View Code →"
    code_hosts: ["github.com", "gitlab.com", "bitbucket.org"]
    bullet_num_id: "1"          # entry bullets, 1.5 line spacing
    education_num_id: "2"       # Education & Certificates lines
    education_max_lines: 3      # the method's hard cap on that section
    # Keep an entry header with its first N bullets (Word keepNext) so it
    # never ends a page alone (#82).
    keep_with_first_bullets: 1
    # Bold each JD keyword at its first appearance in the rendered bullets
    # (never title lines). Whole-word matches, longest wins.
    bold_jd_keywords: true
  dashboard:
    # Only the top of the skipped table is ever scanned.
    skipped_limit: 200
    github:
      # Workflow the "GitHub" run option dispatches. GITHUB_REPO / GITHUB_TOKEN
      # come from .env; the token needs only `actions: write`.
      workflow_file: "pipeline.yml"
      # Must be the default branch: GitHub only lists workflow_dispatch
      # workflows from it.
      ref: "main"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"   # overridden by LOG_LEVEL env var
  format: "json"  # structlog JSON output
