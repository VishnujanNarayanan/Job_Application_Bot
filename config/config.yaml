# config/config.yaml
# Single source of truth for all runtime tunables. No magic numbers in src/.
# Secrets (API keys, DATABASE_URL) live in .env only.
# The user owns master_profile.yaml (gitignored); this file is checked in.

# ---------------------------------------------------------------------------
# Operator identity — architecture doc Section 2 / NFR-11 (instance-ready)
# These are the CURRENT operator's values; they live in config, never in
# src/. A different person swaps this block (+ .env, master_profile.yaml,
# resumes/templates/) and runs their own instance with zero code edits.
# Resume/cover filenames are DERIVED from full_name (see src/config.py),
# never hardcoded.
# ---------------------------------------------------------------------------
operator:
  full_name: "Vishnujan Narayanan"   # drives derived resume/cover filenames
  years_experience: 1.5
  timezone: "Asia/Kolkata"

# ---------------------------------------------------------------------------
# Hard filters — Layer 2/3 job rejection (architecture doc Section 2)
# ---------------------------------------------------------------------------
filters:
  job_type: "fulltime"
  # Reject any JD requiring more years than this. Single source of truth —
  # re-checked on the Gemini-structured field in Layer 3.
  years_ceiling: 5
  # Open to international relocation; no visa filter applied.
  visa_filter: null
  # Reject scraped jobs whose location string contains any of these
  # (case-insensitive substring match). Delhi NCR is excluded.
  disallowed_regions:
    - "Delhi"
    - "Gurgaon"
    - "Gurugram"
    - "Noida"
    - "Ghaziabad"
    - "Faridabad"
  company_blocklist: []   # no companies currently blocked

# ---------------------------------------------------------------------------
# Salary — informational only (cover letter + notification text). Never
# auto-filled on any form (FR-12). Expected = JD upper bound if specified,
# else this default.
# ---------------------------------------------------------------------------
salary:
  default_expected_lpa: 6.0

# ---------------------------------------------------------------------------
# Scheduler — Layer 1
# ---------------------------------------------------------------------------
scheduler:
  # No application quotas: every match >= 0.50 produces a notification
  # (CLAUDE.md hard rule #14). The old cycle_quota / peak_hours window
  # rationed auto-applications, which no longer exist.
  # Cron cadence is managed at the OS / Oracle Cloud level, not from Python.
  # These values are documentation for the cron entries to configure.
  cadence:
    peak_interval_minutes: 40     # weekdays 8am–6pm IST
    off_peak_interval_hours: 4    # nights and weekends
    weekly_report_day: "sunday"
    weekly_report_hour_ist: 8

# ---------------------------------------------------------------------------
# Scraper — Layer 2 (JobSpy, listings only). LinkedIn is read-only public
# listings — JobSpy never logs into or acts on the operator's account
# (CLAUDE.md hard rule #4 / FR-15).
# ---------------------------------------------------------------------------
scraper:
  hours_old:
    # JobSpy `hours_old` parameter — how far back to look per run.
    # Runs are manually triggered (v2), not every 40 minutes, so a 2-hour
    # window would show almost nothing on a once-a-day click. Sized to cover
    # a day between clicks; the company cooldown and the all_jobs duplicate
    # check stop the wider window re-notifying anything already seen.
    peak: 24
    off_peak: 48
  # Stop searching when this many jobs have passed hard filters in one run.
  short_circuit_count: 20
  # JobSpy results_wanted cap per query term.
  results_wanted_per_term: 50
  # country_indeed — geo-filters Indeed AND Glassdoor only.
  country: "india"
  # location — the ONLY geo-filter LinkedIn honours (it ignores `country`).
  # Without it LinkedIn returns worldwide listings, not India ones. Also
  # refines Indeed/Glassdoor within the country. Use a country or city string.
  location: "India"
  # LinkedIn returns listings WITHOUT the description body unless each one is
  # fetched individually (an extra request per job). Without it jd_text is
  # empty, which (a) starves the Gemini parser and (b) collapses near-duplicate
  # detection — every empty-text embedding is identical (cosine 1.0), so all
  # LinkedIn jobs get flagged as duplicates of the first. Fetching costs more
  # requests → higher throttle risk, bounded by the rate_limit settings below.
  linkedin_fetch_description: true
  # Anti-rate-limit measures (recoverable scraper-IP throttling, hard rule #4).
  rate_limit:
    # Scrape each site in its own JobSpy call so one site's throttling or
    # error doesn't discard the other sites' results.
    per_site: true
    # Per-site retry with exponential backoff + jitter on failure.
    max_retries: 3
    backoff_base_seconds: 5
    # Randomised pause between site calls to avoid bursty request patterns.
    inter_site_delay_seconds: 4
    # Fetching LinkedIn descriptions multiplies requests; cap LinkedIn lower
    # than results_wanted_per_term to bound the request volume per run.
    linkedin_results_wanted: 25
    # Optional rotating proxies passed to JobSpy (empty = direct connection).
    # Free tier has no proxies; this is a hook for the operator to add their
    # own if scraper-IP throttling becomes a problem.
    proxies: []
  sites:
    # Temporarily LinkedIn-only: apis.indeed.com is timing out from this
    # network. Re-add "indeed" and "glassdoor" once connectivity is restored.
    - "linkedin"
  # Search-term rotation. Each run takes `terms_per_run` terms starting at the
  # persisted index (search_rotation_state table) and advances past them, so
  # consecutive runs sweep the list rather than repeating its head.
  #
  # Sizing is a cost/coverage trade: each scraped job costs 1 Gemini call to
  # parse, plus 1 more to build if it scores >= 0.50. More terms per run means
  # fewer clicks to sweep the 24-term list, but a bigger bill per click.
  # Currently 1 — the cheapest setting, one term per run as before.
  terms_per_run: 1
  search_terms:
    - "backend engineer"
    - "backend developer"
    - "software engineer python"
    - "platform engineer"
    - "API developer"
    - "data engineer"
    - "analytics engineer"
    - "data pipeline engineer"
    - "data scientist"
    - "data analyst"
    - "machine learning engineer"
    - "ML engineer"
    - "AI engineer"
    - "fullstack engineer"
    - "full stack developer"
    - "software engineer"
    - "devops engineer"
    - "SRE"
    - "quant developer"
    - "trading systems developer"
    - "financial software engineer"
    - "market data engineer"
    - "quantitative researcher"
    - "quantitative analyst"
  # Never apply to the same company twice within this many days.
  cooldown_days: 10

# ---------------------------------------------------------------------------
# Selection — Layer 4 (pure deterministic, no LLM)
# ---------------------------------------------------------------------------
selection:
  experience:
    weight_alias: 0.30    # best title alias cosine score contribution
    weight_bullets: 0.70  # top-3 bullet avg cosine score contribution
    threshold: 0.45
    max_shown: 3
    min_shown: 2
    bullets_per_experience: 3   # exactly 3 bullets shown per experience
    # If best_score - second_score > this gap, best-match goes to position 1.
    # Otherwise positions 1+ follow recency (most recent first).
    match_then_recency_gap: 0.20

  project:
    weight_name: 0.20     # project name cosine score contribution
    weight_bullets: 0.80  # topN bullet avg contribution (N = bullets shown)
    threshold: 0.50
    max_shown: 3
    min_shown: 2
    bullet_threshold: 0.40  # individual bullet floor; 2 force-included if fewer pass
    bullet_min: 2
    bullet_max: 3
    hide_section: false   # projects section NEVER hidden

  summary:
    # Deterministic: pick summary whose role_categories match the JD's
    # role_category, then highest cosine score. Falls back to all summaries
    # if no category match.
    fallback_to_all: true

  skills:
    # Step 1: deterministic scoring takes top-14 pool candidates.
    top_candidates: 14
    # Step 2: group the candidates using the explicit taxonomy below, then show
    # the `categories_count` categories whose skills best match this JD.
    #
    # Why an explicit map rather than embedding similarity: knowing Grafana is
    # observability, or that pytest is testing rather than infrastructure, is
    # world knowledge. Sentence-transformer cosines between a short tech token
    # and a category phrase do NOT carry it — measured on this pool, correct
    # pairings scored 0.106-0.375 while wrong ones scored 0.054-0.347. The
    # ranges overlap, so no threshold can separate them: "Grafana ->
    # Monitoring" (right) scores 0.106 while "Linux -> Web & Frontend" (wrong)
    # scores 0.347. A lookup is exact and costs nothing.
    #
    # Headings still vary per job, because which categories appear depends on
    # which skills this JD pulled to the top: a data JD surfaces the data
    # categories, a backend JD surfaces the backend ones.
    #
    # Keep in step with master_profile.yaml's skills_pool. A skill missing from
    # here still gets grouped (nearest category by embedding) and is logged as
    # `skill_untaxonomised` so it can be added.
    categories_count: 3
    taxonomy:
      "Languages":
        - "Python"
        - "JavaScript"
        - "TypeScript"
        - "SQL"
        - "C++"
        - "Bash"
      "Backend & APIs":
        - "Backend Development"
        - "REST API Development"
        - "FastAPI"
        - "NestJS"
        - "Node.js"
        - "Express.js"
        - "WebSockets / Socket.IO"
        - "JWT Authentication"
        - "Webhook & Callback Handling"
      "Frontend & Full-Stack":
        - "Full-Stack Development"
        - "React"
        - "Next.js"
        - "React Native"
        - "Tailwind CSS"
        - "Responsive Web Design"
      "Data Engineering & ETL":
        - "Data Engineering"
        - "ETL Pipelines"
        - "Data Ingestion"
        - "Incremental / Resumable ETL"
        - "Data Quality & Validation"
        - "Anomaly Detection"
      "Scraping & Browser Automation":
        - "Web Scraping"
        - "Browser Automation"
        - "Playwright"
        - "Selenium"
        - "Scrapy"
        - "Crawlee"
        - "BeautifulSoup"
        - "Proxy Rotation"
        - "Anti-bot / Stealth Scraping"
        - "Session Management"
        - "HTML Parsing / DOM Traversal"
      "Concurrency & Networking":
        - "Async Programming (asyncio)"
        - "Concurrent / Parallel Programming"
        - "Rate-limit Handling & Backoff"
        - "HTTP Internals (headers, cookies, TLS, sessions)"
      "Machine Learning & NLP":
        - "Machine Learning"
        - "Deep Learning"
        - "Natural Language Processing"
        - "Feature Engineering"
        - "scikit-learn"
        - "PyTorch"
        - "TensorFlow"
        - "Keras"
        - "Computer Vision"
        - "Semantic Search / Vector Retrieval"
        - "sentence-transformers"
        - "FAISS"
      "Data Analysis & Visualisation":
        - "Statistical Analysis / Hypothesis Testing"
        - "pandas"
        - "NumPy"
        - "Matplotlib"
        - "Seaborn"
        - "Jupyter"
      "Databases & Storage":
        - "PostgreSQL"
        - "MongoDB"
        - "Redis"
        - "SQLite"
        - "TypeORM"
        - "Database Schema Design"
        - "Caching Strategies"
      "Cloud, DevOps & Tooling":
        - "Docker"
        - "AWS"
        - "Linux"
        - "Git / GitHub"
        - "CI/CD (GitHub Actions)"
        - "Vercel"
        - "Railway"
      "Quantitative Finance":
        - "Quantitative Finance / Market Data"
        - "Time-Series Analysis"
        - "Backtesting"
        - "Financial Data Analysis"
        - "NSE / Indian Equity Markets"
        - "Risk-adjusted Scoring"
      "Integrations & Platform":
        - "Twilio (Voice / IVR)"
        - "Geospatial / Location-Based Matching"
    skills_per_category_min: 3
    skills_per_category_max: 5
    # Gap skills shown under "Familiar With" (ordered against the other
    # categories by match, never pinned first — hard rule #7).
    familiar_with_max: 4

# ---------------------------------------------------------------------------
# Scoring — Layer 4 final score formula
# ---------------------------------------------------------------------------
scoring:
  final:
    # Weights sum to 1.0.
    fit: 0.55
    success_prob: 0.30
    recency: 0.10
    project: 0.05
  # Jobs below this threshold are not applied to (reason: LOW_SCORE).
  apply_threshold: 0.50

  fit:
    # Weights sum to 1.0.
    best_experience: 0.50
    selected_summary: 0.20
    avg_skill_pool_match: 0.30

  success_prob:
    # Collapsed formula per project decision (applicant_score and age_score
    # were undefined in the architecture doc; removed from spec).
    # success_prob = seniority * 0.60 + recency * 0.40
    weight_seniority: 0.60
    weight_recency: 0.40
    # Scores for Gemini-parsed role_level field.
    seniority_scores:
      junior: 1.00
      mid: 0.80
      senior: 0.40
      lead: 0.15
      null: 0.80  # treat unknown level as mid

  recency_score:
    # Bands by hours since the job was posted, first match wins. Ordered
    # ascending by `under_hours`; both the edges and the scores are tunable
    # here (they used to be hardcoded at 1/3/6/12h in apply_decision.py).
    #
    # Sized to the 24h `scraper.hours_old` window. The old bands topped out at
    # "over_12h" so, once runs became manual and the lookback widened to 24h,
    # EVERY scraped job landed in the last band and recency became a constant
    # 0.20 rather than a signal — costing every job up to 0.08 of final score
    # (0.10 weight x the 0.8 spread) and pushing a cluster of real candidates
    # from ~0.50 down to ~0.43. Observed on the live run of 2026-08-08, where
    # all 9 scored jobs reported recency 0.2.
    bands:
      - under_hours: 6
        score: 1.00
      - under_hours: 24
        score: 0.60
      - under_hours: 72
        score: 0.40
    # Older than the last band, or no posting timestamp at all.
    default: 0.30

# ---------------------------------------------------------------------------
# Resume builder — Layer 5
# ---------------------------------------------------------------------------
builder:
  template_path: "resumes/templates/Templete.docx"   # actual filename (typo in name kept)
  output_dir: "resumes/applied"
  # Diff check: reject any build that modifies content outside permitted
  # regions. Header (before first WORK EXPERIENCE Heading1) is never touched.
  diff_check_enabled: true
  # Regenerate up to this many times when Pydantic or post-validation fails.
  llm_regenerate_attempts: 2
  cover_letter_max_chars: 900

# ---------------------------------------------------------------------------
# Voice / fabrication guard — cover letter text (Layer 5)
# Applied to the LLM-generated cover letter. The old form-answer voice
# validation was removed with auto-apply; the banned-word list stays and
# will be re-homed into the builder in Phase B.
# ---------------------------------------------------------------------------
voice:
  banned_words:
    - "leverage"
    - "synergy"
    - "robust"
    - "scalable"
    - "holistic"
    - "passionate about"
    - "I bring a unique blend"
    - "I am excited to"
    - "I am writing to"
    - "with X years of experience in"
    - "as a [role]"
  # Post-validation: regenerate up to builder.llm_regenerate_attempts times.

# ---------------------------------------------------------------------------
# Cover letter PDF render contract — Layer 6 pdf_render.py
# Plain black text. Arial 11pt. 2cm margins. Single page. No header/footer.
# Structure: line 1 = name + email, line 2 = date, body below.
# ---------------------------------------------------------------------------
cover_pdf:
  font_family: "Arial"
  font_size_pt: 11
  font_color: "#000000"
  margin_cm: 2.0
  single_page: true
  header_enabled: false
  footer_enabled: false

# ---------------------------------------------------------------------------
# Embeddings & NLP
# ---------------------------------------------------------------------------
embeddings:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  dim: 384   # vector(384) in pgvector schema

spacy:
  model: "en_core_web_sm"

# ---------------------------------------------------------------------------
# LLM — Gemini (2-call budget max per job)
# Call 1a: JD parse (always). Call 1b: title+skills+cover (if score >= 0.50).
# Old Call 2 (batched form questions) removed with auto-apply.
#
# Model choice: `gemini-2.5-flash` was retired mid-flight on 2026-08-08 —
# every call 404'd with "no longer available to new users", which killed a
# live run. Note the model still appeared in list_models(); being listed does
# NOT mean it is callable. Verify with a real generateContent call.
#
# `gemini-3.6-flash` is the newest stable flash, so it buys the longest runway
# before the next retirement. Avoid `-preview` suffixes (withdrawn without
# notice) and `gemini-flash-latest` (silently changes under you, which can
# break structured output mid-run). Lite variants are cheaper and ~3x faster
# but measurably worse at extraction — one dropped "Senior" from a job title,
# and seniority feeds the success_prob score directly.
# ---------------------------------------------------------------------------
llm:
  # Any OpenAI-compatible endpoint. Switching provider is an edit here plus a
  # key in .env — no code change, and every Pydantic schema is unaffected.
  #
  #   groq       https://api.groq.com/openai/v1                 GROQ_API_KEY
  #   cerebras   https://api.cerebras.ai/v1                     CEREBRAS_API_KEY
  #   openrouter https://openrouter.ai/api/v1                   OPENROUTER_API_KEY
  #   gemini     https://generativelanguage.googleapis.com/v1beta/openai/
  #                                                             GEMINI_API_KEY
  #
  # List a provider's real model names before setting `model` — a name that
  # merely appears in a docs page or a list_models() call is not necessarily
  # callable (Gemini listed a retired model that 404'd on every request):
  #     python -m src.cli.llm_check --list
  # Local inference leads. It has no daily cap (Groq allows 100,000 tokens/day,
  # about 45 parses) and no per-minute limit, and it reads the WHOLE ad rather
  # than a clipped one. It answers only while this machine is awake, so every
  # remote run falls straight through to Groq — see max_attempts below.
  provider: "ollama"
  base_url: "${OLLAMA_BASE_URL}"
  api_key_env: "OLLAMA_API_KEY"
  model: "qwen2.5:7b-instruct"
  api: "ollama"
  # One attempt: a local model is either reachable or it is not. On a GitHub
  # Actions runner this laptop is unreachable, and five backoffs per job spent
  # rediscovering that would dwarf the run.
  max_attempts: 1
  jd_text:
    head_chars: 100000
    tail_chars: 0
  # Instructor strategy. TOOLS works on providers with function calling (Groq,
  # Cerebras, OpenAI); JSON_SCHEMA where native schema enforcement exists; JSON
  # is the lowest common denominator. Verify with llm_check after changing it.
  instructor_mode: "JSON"   # unused on the native path
  request_timeout_seconds: 180
  max_calls_per_job: 1   # Call 1b was removed; only the JD parse remains

  # Shared default, used by any provider that does not override it. Kept
  # separate from the primary provider's own `jd_text` block on purpose: the
  # primary IS the top-level llm block, so reading the bound from there would
  # hand a hosted fallback whatever the local model is configured for — which
  # is "unlimited", and would spend Groq's daily budget in one run.
  #
  # Bound how much of a job description reaches the model. BOTH ends are kept:
  # the head carries the role and its requirements, the tail carries pay and
  # application details.
  #
  # Measured over 667 real listings (median 4,172 chars, max 11,815):
  #   head+tail    chars   pay   years   level   jobs clipped
  #   1600+900      53%    70%     53%     86%       78%
  #   2000+1000     61%    73%     67%     90%       70%
  #   3000+1500     81%    87%     88%     97%       45%   <- configured
  #   5000+2000     96%    99%     97%    100%       12%
  #
  # Clipping harder saves real tokens but measurably degrades years_required
  # and role_level, which drive success_prob (30% of the final score). This
  # setting exists to cap the OUTLIERS that spike the per-minute token limit,
  # not to shave every job — the big saving belongs to an embedding pre-filter
  # that skips the parse entirely, which costs no accuracy at all.
  jd_text_default:
    head_chars: 3000
    tail_chars: 1500

  # Providers tried, in order, when the one before gives up. Both of the
  # 2026-08-08 failures were provider-wide rather than per-job — a retired
  # model 404'd every request, and a spend cap 429'd every request — so either
  # would have taken a whole run down. A chain turns that into a slower run.
  #
  # Ordinary rate limiting does NOT advance the chain: each provider's own
  # backoff handles that, and switching on it would send steady traffic
  # downstream for nothing. Only permanent errors and budget exhaustion do.
  #
  # ORDER IS COST, cheapest first: free providers must be exhausted before a
  # metered one is touched. Groq (free) leads; Gemini is metered and sits last.
  # Disabled entries are skipped entirely, so a provider can sit here ready to
  # switch on without affecting a single run.
  fallbacks:
    # Groq — the hosted safety net, and the ONLY provider a remote run can
    # reach. Verified live: llama-3.3-70b-versatile, TOOLS mode, 1.6s.
    # Free tier: 1,000 requests/day and 100,000 tokens/day.
    - enabled: true
      provider: "groq"
      base_url: "https://api.groq.com/openai/v1"
      api_key_env: "GROQ_API_KEY"
      model: "llama-3.3-70b-versatile"
      instructor_mode: "TOOLS"
      request_timeout_seconds: 60

    # Cerebras — OFF, and it must stay off: verified 2026-08-08 that the API
    # requires payment despite issuing a working key. Listing models succeeds,
    # so only a real call reveals it:
    #     402 payment_required — "Payment required to access this resource"
    # That fails the free-tier rule (#12). Kept here, disabled, so the next
    # person does not spend the same hour rediscovering it; if Cerebras ever
    # opens a free tier, this belongs BEFORE Gemini, since a free provider
    # absorbing an outage costs nothing where reaching Gemini costs money.
    # Re-check with: python -m src.cli.llm_check cerebras
    - enabled: false
      provider: "cerebras"
      base_url: "https://api.cerebras.ai/v1"
      api_key_env: "CEREBRAS_API_KEY"
      model: "gpt-oss-120b"
      instructor_mode: "TOOLS"
      request_timeout_seconds: 60

    # gemini-2.5-flash-lite is deliberate: cheap, and NON-thinking. The pricier
    # gemini-3.6-flash emits reasoning tokens that bill as output — 60 job-ad
    # parses cost roughly 20x what the token count implied.
    - enabled: true
      provider: "gemini"
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key_env: "GEMINI_API_KEY"
      model: "gemini-2.5-flash-lite"
      instructor_mode: "JSON"
      request_timeout_seconds: 60

  backoff:
    # Sized for paid Tier 1 (hundreds of requests/minute), not the free tier's
    # 5/min which the old 20s/90s values were fighting. Permanent errors (404
    # retired model, bad key, malformed request) no longer consume this budget
    # at all — see _is_permanent() in src/llm/client.py.
    initial_seconds: 2
    max_seconds: 30
    max_attempts: 5

# ---------------------------------------------------------------------------
# State / database — Layer 7 (Neon PostgreSQL, free tier)
# ---------------------------------------------------------------------------
database:
  pool_size: 2
  max_overflow: 5
  pool_pre_ping: true   # SQLAlchemy auto-recovers on network blip
  outage_buffer_path: "data/pending_writes.jsonl"   # drained next run
  outage_backoff_attempts: 3

storage:
  resumes_applied_dir: "resumes/applied"    # NEVER auto-cleaned (audit trail)
  logs_dir: "data/logs"
  cleanup:
    logs_retention_days: 365
    resumes_applied_retention_days: null   # null = keep forever

# ---------------------------------------------------------------------------
# Notifications — Layer 8 (Telegram)
# ---------------------------------------------------------------------------
notifications:
  digest_hour_ist: 8
  # Telegram alert sent immediately when any of these conditions trigger.
  critical_alert_triggers:
    - "gemini_api_failure"
    - "database_connection_failure"
    - "master_profile_validation_failure"
    - "portal_zero_results_consecutive"
  # Alert after this many consecutive zero-result runs from a portal.
  portal_zero_results_threshold: 3

# ---------------------------------------------------------------------------
# Analytics — Layer 9 (local files). Google Sheets/Docs were removed in v2:
# they needed a GCP project, a service-account JSON, and a bind mount to
# produce a table and a text report that local files do just as well.
#
# The CSVs are DERIVED from Postgres by `export_index`, never appended during
# a run — a phone-triggered run executes on an ephemeral GitHub Actions runner
# whose disk is destroyed at job end, so inline appends would be lost. Every
# column is derivable from the DB, so regenerating on the laptop picks up
# remote runs automatically. Paths are relative to the repo root.
# ---------------------------------------------------------------------------
analytics:
  local:
    dir: "data/index"
    matches_file: "matches.csv"
    skipped_file: "skipped.csv"
    near_duplicates_file: "near_duplicates.csv"
  report:
    monthly_enabled: true
    dir: "data/reports"
    # Skills appearing in >= this fraction of the month's JDs trigger a
    # "consider learning" alert in the report.
    skill_demand_alert_threshold: 0.30

# ---------------------------------------------------------------------------
# AWS — S3 cache + backup (Iteration 2+). Region ap-south-1 always.
# Credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) live in .env only.
# ---------------------------------------------------------------------------
aws:
  region: "ap-south-1"
  # Bucket name is operator-specific (not a secret). Override here per instance.
  s3_bucket: "application-bot-vishnujan-resumes"

# ---------------------------------------------------------------------------
# Pre-render — Layer 6 at build time (amends CLAUDE.md hard rule #8).
#
# Rule #8 says resumes render on demand and are never stored at build time.
# The operator explicitly overrode this so resume links work with the laptop
# switched off: the on-demand endpoint runs on the laptop, so a run triggered
# from the phone would otherwise produce links that 404 until it is reopened.
#
# It stays a CACHE, not a permanent pile — renders go to the same
# `{ext}_cache/` S3 prefix, which already carries a 1-month lifecycle rule,
# and are recorded in render_cache with a matching TTL. The endpoint still
# renders on demand for anything expired or never pre-rendered.
# ---------------------------------------------------------------------------
prerender:
  enabled: true
  # Presigned-URL lifetime. AWS SigV4 caps this at 7 days; longer values are
  # clamped. A listing is usually stale by then anyway, and the endpoint still
  # serves the resume once the laptop is back on.
  link_expiry_days: 7

# ---------------------------------------------------------------------------
# Resume endpoint + dashboard — FastAPI (Layer 6).
#
# base_url is the host embedded in Telegram resume links. It is the machine's
# Tailscale name: reachable from the operator's phone and laptop and from
# nothing else, with a stable hostname and real certificates. ngrok was
# dropped in v2 — it published the endpoint, which has no authentication, to
# the whole internet on a guessable URL scheme (/resume/{job_id} where job_id
# is the portal's own public posting id).
#
# Set this up once on the host:   tailscale serve --bg 8000
# then read the name from:        tailscale status --json | grep DNSName
#
# Links only resolve on tailnet devices. Build-time pre-rendered resumes
# (see `prerender` above) are served from S3 instead, so a phone-triggered
# run still produces links that work anywhere.
# ---------------------------------------------------------------------------
endpoint:
  # Reachable only from devices on this operator's tailnet, which is the
  # security boundary — the dashboard and resume endpoint have no auth.
  # Telegram also rejects a localhost url outright, discarding the whole
  # notification, so leaving this as the placeholder silently cost a match.
  base_url: "https://asus-tuf-f16-vishnu.tail106cde.ts.net"
  port: 8000
  # Template path is config-driven so any instance can swap the file.
  template_path: "resumes/templates/Templete.docx"
  # How long a cached render stays valid, in days.
  #
  # MUST be kept in step with the S3 lifecycle rule on the `pdf_cache/` and
  # `docx_cache/` prefixes. If S3 expires objects sooner than this, the
  # render_cache table goes on claiming hits for objects that no longer exist;
  # the endpoint still serves the resume (it re-renders), but every "hit"
  # silently costs a full rebuild.
  render_cache_ttl_days: 90
  # Operator dashboard (Layer 6 browser surface).
  dashboard:
    # The skipped table is the biggest one and only its top is ever scanned.
    skipped_limit: 200
    github:
      # Dispatch target for the "GitHub" run option. Repo and token come from
      # GITHUB_REPO / GITHUB_TOKEN in .env — the token needs only
      # `actions: write` on this repository.
      workflow_file: "pipeline.yml"
      # The branch the workflow runs from. GitHub also only lists
      # workflow_dispatch workflows in the Actions UI (and the mobile app)
      # for the DEFAULT branch, so this must stay in step with it.
      ref: "main"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"   # overridden by LOG_LEVEL env var at runtime
  format: "json"  # structlog JSON output
