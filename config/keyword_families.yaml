# Keyword families (#23): one skill, many spellings.
#
# The matcher (src/scorer/keywords.py: matches) already treats these as the same,
# with no entry here:
#   * case, spacing and hyphens       Power BI = PowerBI, Infrastructure-as-Code
#   * a ".js"/"js" suffix             React.js = ReactJS = React, Node.js = Node
#   * a plural on the last word       REST APIs = REST API, code reviews = code review
#   * RESTful = REST
# Those rules were derived from, and cover, the 142 variant groups found across
# 7,619 distinct skill phrases in 979 parsed adverts (2026-10-04) -- and any
# future spelling of the same shape.
#
# This file holds what rules cannot know: MEANING.
#   variants: the same skill, equivalent both ways (Postgres <-> PostgreSQL).
#   members:  specific skills that IMPLY the family, one way only. A MongoDB
#             bullet covers an advert asking for "NoSQL"; a bullet that only says
#             "NoSQL" does NOT cover an advert asking for MongoDB. That asymmetry
#             is what keeps the resume from claiming a tool it never names.
#
# Seeded from the most frequent required/nice-to-have skills in stored adverts
# (counts are adverts, 2026-10-04). Add a family when an advert's wording keeps
# missing a bullet that does say the same thing.

