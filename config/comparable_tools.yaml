# Comparable tools (#191): the same job, a different product.
#
# Written by hand from every skill in the registry (2,014 on 2026-11-05).
# A group says "having used one of these is close to having used another":
# an advert asking for Google Cloud Storage is partly met by an S3 bullet.
#
# What a comparable tool may do (the operator's decision, 2026-11-05):
#   * partial credit in the fit score (scoring.comparable.credit);
#   * the bullet that proves it is picked and bolded for the advert's ask.
# The ask still shows as a gap skill, and the tool in a bullet is never
# renamed: the resume only claims what was used.
#
# This is NOT the one-way "proves" relation (config/keyword_families.yaml,
# members): PostgreSQL proves SQL; MongoDB proves neither SQL nor PostgreSQL,
# but is comparable to Cosmos DB and Firestore.
#
# Not grouped on purpose: API styles (REST vs GraphQL vs gRPC), methods
# (ARIMA vs Prophet), and NO general programming languages (C, C++, Java,
# Scala, Kotlin, JavaScript/TypeScript, R...): interviews test the language
# itself (the operator's rule, 2026-11-05; the #179 benchmark flipped an
# Android job on Scala for Kotlin). Shells and SQL dialects do group.


